name: Portable bridge tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roundtrip:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test file bridge
        run: python -m unittest discover -s tests -v
      - name: Compile scripts
        run: python -m compileall -q bridge.py codex_bridge.py auto_daemon.py tests
